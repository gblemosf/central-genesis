name: Deploy Supabase

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: hrcxlljvoemiaqhkihqp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify validated commit is still main
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Deployment refused: the validated commit must match the checkout and current main. Run CI for current main."
            exit 1
          fi

      - name: Check deployment credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply pending migrations
        # GitHub-hosted runners use IPv4. Keep the password out of the URL and logs.
        run: >-
          supabase db push
          --db-url "postgresql://postgres.$SUPABASE_PROJECT_ID@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          --yes

      - name: Deploy Edge Functions
        run: >-
          supabase functions deploy hubla-webhook fetch-meta-data payt-webhook assiny-webhook
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
