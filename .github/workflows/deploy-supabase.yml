name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: hrcxlljvoemiaqhkihqp
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase deployment skipped. Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: 2.117.0

      - name: Link production project
        if: steps.credentials.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push --linked --yes

      - name: Deploy Edge Functions
        if: steps.credentials.outputs.ready == 'true'
        run: >-
          supabase functions deploy hubla-webhook fetch-meta-data payt-webhook
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
