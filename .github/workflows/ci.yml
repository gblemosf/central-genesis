name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase start
      - run: supabase db lint --local --level warning
      - run: supabase test db
      - run: npm run build
